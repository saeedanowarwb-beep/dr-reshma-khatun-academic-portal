<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | Dr. Reshma Khatun</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
body{background:#f7f8fb}.admin-wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}
.login{max-width:420px;margin:55px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}
.login input,.panel input,.panel textarea,.panel select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px;font:inherit}
.login button,.panel button{margin-top:8px}.hidden{display:none!important}
.banner{padding:14px 18px;background:#eef4ff;border:1px solid #d5e1ff;border-radius:10px;margin:18px 0 24px}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.admin-card{padding:20px}
.panel{display:none;background:#fff;border:1px solid #ddd;border-radius:12px;padding:22px;margin:24px 0}
.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}
.msg{min-height:20px}.records{margin-top:18px}.record{border-top:1px solid #eee;padding:13px 0}.record h4{margin:0 0 5px}.record p{white-space:pre-line;margin:4px 0}.danger{border-color:#b42318!important;color:#b42318!important}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button.active{background:#213b89;color:#fff}
@media(max-width:800px){.admin-grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body class="admin-body">
<header class="topbar"><div class="wrap nav-wrap">
<a class="brand" href="index.html">Dr. Reshma Khatun</a>
<span class="admin-pill">Admin Dashboard</span>
<button id="logout" class="hidden">Logout</button>
</div></header>

<div id="login" class="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg" class="msg"></p>
<p id="connectionMsg" class="msg" style="font-size:13px;color:#666;"></p>
</div>

<main id="app" class="hidden"><div class="admin-wrap">
<div class="section-kicker">ADMIN DASHBOARD</div>
<h1>Manage Academic Portal</h1>
<p id="user" class="admin-user"></p>
<div class="banner"><strong>Supabase-connected dashboard.</strong> All panels below work with the supplied database tables. URL fields are used for PDFs/images because no Storage bucket definition was supplied.</div>
<div id="cards" class="admin-grid"></div>
<div id="panels"></div>
</div></main>

<script>
(()=>{"use strict";
const SUPABASE_URL = "https://uupdkljuavsxkrefmzr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_GC-wNHVFIGCxNujgk7t1XQA_jnxXdVqcb";
const S = window.supabaseClient || window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_PUBLISHABLE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(!S){$("loginMsg").textContent="Supabase client is not available.";return}

const configs={
profiles:{title:"Profile",desc:"Edit the academic profile.",fields:[
["name","Name","text",1],["designation","Designation","text"],["department","Department","text"],["institution","Institution","text"],
["email","Email","email"],["phone","Phone","text"],["address","Address","text"],["profile_image_url","Profile Image URL","url"],["biography","Biography","textarea"]]},
education:{title:"Education",desc:"Degrees, institutions and disciplines.",fields:[
["degree","Degree","text",1],["institution","Institution","text",1],["year","Year","text"],["discipline","Discipline","text"],["details","Details","textarea"],["sort_order","Sort Order","number"]]},
teaching_experience:{title:"Teaching Experience",desc:"Teaching positions and experience.",fields:[
["designation","Designation","text"],["institution","Institution","text"],["start_date","Start Date","text"],["end_date","End Date","text"],["details","Details","textarea"],["sort_order","Sort Order","number"]]},
specializations:{title:"Specializations",desc:"Academic specialization areas.",fields:[["title","Title","text",1],["sort_order","Sort Order","number"]]},
notices:{title:"Notices",desc:"Create and publish notices.",fields:[
["title","Title","text",1],["description","Description","textarea",1],["notice_date","Notice Date","date",1],["category","Category","text"],["pdf_url","PDF URL","url"],["is_published","Publish","checkbox"]]},
resources:{title:"Resources",desc:"PDFs and academic resources.",fields:[["title","Title","text",1],["description","Description","textarea"],["category","Category","text"],["file_url","PDF / Resource URL","url",1]]},
routine:{title:"Routine",desc:"Weekly class routine.",fields:[["day_name","Day","text",1],["class_time","Class Time","text"],["course_name","Course Name","text"],["semester","Semester","text"],["room","Room","text"],["details","Details","textarea"]]},
phd_scholars:{title:"PhD Scholars",desc:"Ongoing, awarded and submitted scholars.",fields:[
["scholar_name","Scholar Name","text",1],["research_title","Research Title","textarea",1],["status","Status","text",1],["year","Year","number",1],["details","Details","textarea"]]},
journal_papers:{title:"Journal Papers",desc:"Journal publications.",fields:[
["title","Title","textarea",1],["authors","Authors","text"],["journal","Journal","text"],["year","Year","text"],["volume_issue","Volume / Issue","text"],["pages","Pages","text"],["issn","ISSN","text"],["doi","DOI","text"],["indexing","Indexing","text"],["url","Article URL","url"],["sort_order","Sort Order","number"]]},
books:{title:"Books",desc:"Published books.",fields:[["title","Title","textarea",1],["authors","Authors","text"],["publisher","Publisher","text"],["year","Year","text"],["isbn","ISBN","text"],["sort_order","Sort Order","number"]]},
book_chapters:{title:"Book Chapters",desc:"Chapters in books.",fields:[
["title","Chapter Title","textarea",1],["authors","Authors","text"],["book_title","Book Title","text"],["publisher","Publisher","text"],["year","Year","text"],["isbn","ISBN","text"],["pages","Pages","text"],["doi","DOI","text"],["url","URL","url"],["sort_order","Sort Order","number"]]},
news:{title:"News",desc:"Academic news and updates.",fields:[["title","Title","text",1],["summary","Summary","textarea"],["content","Content","textarea"],["news_date","News Date","date"],["image_url","Image URL","url"]]},
events:{title:"Events",desc:"Seminars, conferences and events.",fields:[["title","Title","text",1],["event_type","Event Type","text",1],["institution","Institution","text"],["location","Location","text"],["event_date","Event Date","text"],["presentation","Presentation","text"],["details","Details","textarea"]]},
invited_talks:{title:"Invited Talks",desc:"Invited lectures and talks.",fields:[["talk_title","Talk Title","textarea",1],["organizer","Organizer","text"],["venue","Venue","text"],["event_date","Event Date","text"],["role_text","Role","text"],["details","Details","textarea"]]},
sessions_chaired:{title:"Sessions Chaired",desc:"Chaired academic sessions.",fields:[["event_title","Event Title","textarea",1],["institution","Institution","text"],["location","Location","text"],["event_date","Event Date","text"],["role_text","Role","text"],["details","Details","textarea"]]},
memberships:{title:"Memberships",desc:"Professional memberships.",fields:[["organization","Organization","text",1],["role_text","Role","text",1],["year","Year","text"],["details","Details","textarea"]]},
gallery:{title:"Gallery",desc:"Academic event images.",fields:[["title","Title","text"],["image_url","Image URL","url",1],["caption","Caption","textarea"]]}
};

const cards=$("cards"),panels=$("panels");
Object.entries(configs).forEach(([table,c])=>{
 cards.insertAdjacentHTML("beforeend",`<article class="card admin-card"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><button data-open="${table}">Manage</button></article>`);
 panels.insertAdjacentHTML("beforeend",`
 <section id="panel-${table}" class="panel">
  <h2>${esc(c.title)}</h2>
  <form id="form-${table}" class="fields"></form>
  <p id="msg-${table}" class="msg"></p>
  <div id="records-${table}" class="records"></div>
  <button type="button" data-close="${table}">Close</button>
 </section>`);
 const form=$("form-"+table);
 c.fields.forEach(([key,label,type,required])=>{
   const req=required?"required":"";
   const full=type==="textarea"||key==="biography"||key==="description"||key==="content"||key==="details"?" full":"";
   let el;
   if(type==="textarea") el=`<textarea id="${table}-${key}" class="${full.trim()}" ${req} placeholder="${esc(label)}"></textarea>`;
   else if(type==="checkbox") el=`<label class="full"><input id="${table}-${key}" type="checkbox"> ${esc(label)}</label>`;
   else el=`<input id="${table}-${key}" class="${full.trim()}" type="${type}" ${req} placeholder="${esc(label)}">`;
   form.insertAdjacentHTML("beforeend",el);
 });
 form.insertAdjacentHTML("beforeend",`<div class="full"><button type="submit">Save ${esc(c.title)}</button></div>`);
});

function open(table){document.querySelectorAll(".panel").forEach(p=>p.style.display="none");$("panel-"+table).style.display="block";load(table);$("panel-"+table).scrollIntoView({behavior:"smooth",block:"start"})}
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>open(b.dataset.open));
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{$("panel-"+b.dataset.close).style.display="none"});

function val(table,key,type){
 const e=$(table+"-"+key);
 if(type==="checkbox") return e.checked;
 const v=e.value.trim();
 if(v==="") return null;
 if(type==="number") return Number(v);
 return v;
}
function resetForm(table){$("form-"+table).reset();}

async function load(table){
 const c=configs[table];
 let q=S.from(table).select("*");
 if(["education","teaching_experience","specializations","journal_papers","books","book_chapters"].includes(table)) q=q.order("sort_order",{ascending:true});
 else q=q.order("id",{ascending:false});
 const {data,error}=await q;
 if(error){$("msg-"+table).textContent="Error: "+error.message;return}
 if(table==="profiles" && data?.[0]) { fillProfile(data[0]); $("form-profiles").dataset.id=data[0].id; }
 const box=$("records-"+table);
 if(!data?.length){box.innerHTML="<p>No records available.</p>";return}
 box.innerHTML=data.map(r=>{
   const main=r.title||r.name||r.scholar_name||r.talk_title||r.event_title||r.organization||r.degree||r.designation||"Record";
   const bits=c.fields.filter(f=>f[0]!=="title"&&f[0]!=="name").map(f=>{
     const v=r[f[0]];
     if(v===null||v===undefined||v==="") return "";
     if(f[2]==="checkbox") return `<p>${esc(f[1])}: ${v?"Yes":"No"}</p>`;
     return `<p><strong>${esc(f[1])}:</strong> ${esc(v)}</p>`;
   }).filter(Boolean).join("");
   return `<div class="record"><h4>${esc(main)}</h4>${bits}<button class="danger" data-del="${table}" data-id="${r.id}">Delete</button></div>`;
 }).join("");
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
   if(!confirm("Delete this record?"))return;
   const {error}=await S.from(table).delete().eq("id",b.dataset.id);
   if(error) alert(error.message); else load(table);
 });
}

function fillProfile(r){
 configs.profiles.fields.forEach(([key])=>{if($( "profiles-"+key)) $("profiles-"+key).value=r[key]||""});
}
$("form-profiles").addEventListener("submit",async e=>{
 e.preventDefault();const id=e.target.dataset.id;
 const p={};configs.profiles.fields.forEach(([k,,t])=>{p[k]=val("profiles",k,t)});
 const {data,error}=id?await S.from("profiles").update(p).eq("id",id):await S.from("profiles").insert([p]).select();
 if(error){$("msg-profiles").textContent="Error: "+error.message;return}
 $("msg-profiles").textContent="Profile saved successfully.";if(!id&&data?.[0])e.target.dataset.id=data[0].id;
});

Object.entries(configs).filter(([t])=>t!=="profiles").forEach(([table,c])=>{
 $("form-"+table).addEventListener("submit",async e=>{
   e.preventDefault();$("msg-"+table).textContent="Saving...";
   const p={};c.fields.forEach(([k,,type])=>{p[k]=val(table,k,type)});
   const {error}=await S.from(table).insert([p]);
   if(error){$("msg-"+table).textContent="Error: "+error.message;return}
   $("msg-"+table).textContent="Saved successfully.";resetForm(table);load(table);
 });
});

$("loginBtn").onclick=login;
checkAuthConnection();
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
async function isAdmin(uid){
 const {data,error}=await S.from("admin_users").select("user_id").eq("user_id",uid).maybeSingle();
 return !error&&!!data;
}
async function checkAuthConnection(){
 const el=$("connectionMsg");
 if(!el)return;
 try{
  const response=await fetch(
   SUPABASE_URL+"/auth/v1/health",
   {
    method:"GET",
    headers:{"apikey":SUPABASE_PUBLISHABLE_KEY},
    cache:"no-store"
   }
  );
  if(response.ok){
   el.textContent="Supabase Auth connection: OK";
   el.style.color="#18794e";
  }else{
   el.textContent="Supabase Auth responded with HTTP "+response.status+".";
   el.style.color="#b54708";
  }
 }catch(error){
  el.textContent="Supabase Auth connection could not be reached.";
  el.style.color="#b42318";
 }
}

async function login(){
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  $("loginMsg").textContent="Please enter your email and password.";
  return;
 }

 const btn=$("loginBtn");
 btn.disabled=true;
 $("loginMsg").textContent="Logging in...";

 try{
  let result=await S.auth.signInWithPassword({email,password});

  if(result.error && /failed to fetch|networkerror|load failed/i.test(result.error.message||"")){
   const response=await fetch(
    SUPABASE_URL+"/auth/v1/token?grant_type=password",
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_PUBLISHABLE_KEY
     },
     body:JSON.stringify({email,password}),
     cache:"no-store"
    }
   );

   const text=await response.text();
   let payload={};
   try{payload=JSON.parse(text)}catch(_){}

   if(!response.ok){
    const detail=payload.msg||payload.message||payload.error_description||payload.error||text||("HTTP "+response.status);
    throw new Error("Supabase Auth: "+detail);
   }

   const sessionResult=await S.auth.setSession({
    access_token:payload.access_token,
    refresh_token:payload.refresh_token
   });

   if(sessionResult.error) throw sessionResult.error;

   result={
    data:{user:payload.user||sessionResult.data.user},
    error:null
   };
  }

  if(result.error){
   $("loginMsg").textContent=result.error.message;
   return;
  }

  const user=result.data&&result.data.user;
  if(!user){
   $("loginMsg").textContent="Login succeeded but no user session was returned.";
   return;
  }

  if(!await isAdmin(user.id)){
   await S.auth.signOut();
   $("loginMsg").textContent="You are not authorized as an administrator.";
   return;
  }

  show(user);

 }catch(error){
  console.error("Admin login error:",error);
  $("loginMsg").textContent=error&&error.message?error.message:String(error);
 }finally{
  btn.disabled=false;
 }
}
function show(user){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("user").textContent="Signed in as "+(user.email||"");}
$("logout").onclick=async()=>{await S.auth.signOut();location.reload()};

(async()=>{
 const {data:{session}}=await S.auth.getSession();
 if(session&&await isAdmin(session.user.id)) show(session.user);
})();
})();
</script>
</body>
</html>
